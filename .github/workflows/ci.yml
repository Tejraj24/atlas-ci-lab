name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test

  deploy-check:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "Error: APP_TOKEN is not configured" >&2
            exit 1
          fi
          echo "APP_TOKEN is configured. Ready to deploy."
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
